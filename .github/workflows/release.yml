name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean
      relay_only:
        description: 'Publish only the Relay Docker image'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  create-release:
    if: ${{ !inputs.relay_only }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      # Semver prerelease (e.g. 1.16.94-beta.2) must never become GitHub Latest
      # or enter the Vercel auto-update feed used by stable packaged clients.
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      # Mobile plan mode ("ota" | "native") from mobile-release-plan.mjs.
      # Drives whether iOS/TestFlight builds: native betas and ALL stable
      # releases upload iOS; web-only betas skip it. Also gates the
      # minShellReleaseVersion floor raise in mobile-native-targets.
      plan_mode: ${{ steps.mobile_plan.outputs.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # mobile-release-plan diffs against the latest v* tag.
          fetch-depth: 0

      - name: Compute mobile release plan
        id: mobile_plan
        run: |
          PLAN_JSON="$(node scripts/mobile-release-plan.mjs --json)"
          echo "$PLAN_JSON"
          node -e "
            const plan = JSON.parse(process.argv[1]);
            const mode = plan.mode === 'native' ? 'native' : 'ota';
            console.log('mode=' + mode);
          " "$PLAN_JSON" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            version="$RELEASE_INPUT_VERSION"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const expected = process.env.VERSION;
          const manifests = [
            'package.json',
            'packages/web/package.json',
            'packages/electron/package.json',
            'packages/relay-server/package.json',
            'packages/vscode/package.json',
          ];
          const mismatches = manifests.flatMap((file) => {
            const actual = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            return actual === expected ? [] : [`${file}: ${actual}`];
          });
          if (mismatches.length > 0) {
            throw new Error(
              `Release version ${expected} does not match:\n${mismatches.join('\n')}\n` +
              'Run bun run version:bump -- <version> and commit the result before releasing.'
            );
          }
          NODE

      - name: Extract changelog for release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const changelogPath = 'CHANGELOG.md';
          if (!fs.existsSync(changelogPath)) {
            throw new Error('CHANGELOG.md not found; add it before releasing.');
          }
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const sections = changelog.split(/^## /m);
          const section = sections.find(s => s.startsWith('[' + version + ']'));
          if (!section) {
            throw new Error('Changelog section [' + version + '] not found. Add a section like "## [' + version + '] - YYYY-MM-DD".');
          }
          const content = ('## ' + section).trim();
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/release-notes.md', content + '\n');
          NODE

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: OpenChamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-macos:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
            runner: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install macOS notarization API key
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_PRIVATE_KEY_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "$name secret is required."
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build Electron app
        working-directory: packages/electron
        env:
          # rebuild-native.mjs reads this to target the right arch when
          # cross-building (runner is arm64; x64 matrix needs the hint).
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own — we must rebuild against the
          # target Electron ABI before packaging, otherwise better-sqlite3/
          # node-pty/bun-pty crash on require inside the packaged app.
          bun run rebuild:native
          bunx electron-builder --mac --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Verify Developer ID macOS signature
        run: |
          set -euo pipefail

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGN_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          if ! echo "$SIGN_INFO" | grep -q "Authority=Developer ID Application"; then
            echo "Error: expected a Developer ID Application signature"
            exit 1
          fi
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          echo "Developer ID macOS app prepared at $APP_PATH"

      - name: Upload DMG / ZIP / blockmaps to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-arch latest-mac.yml for merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  build-desktop-electron-windows:
    needs: create-release
    # windows-latest currently resolves to a runner with Visual Studio 18,
    # which this electron/node-gyp stack does not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest.yml
          retention-days: 1

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/OpenChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$APPIMAGE" "$VERSION"

      - name: Upload validated Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/OpenChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  publish-electron-linux:
    needs: [create-release, build-desktop-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download x64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-x64
          path: artifacts/x64

      - name: Download arm64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-arm64
          path: artifacts/arm64

      - name: Revalidate separate Linux manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/x64/latest-linux.yml \
            "artifacts/x64/OpenChamber-${VERSION}-linux-x86_64.AppImage" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/arm64/latest-linux-arm64.yml \
            "artifacts/arm64/OpenChamber-${VERSION}-linux-arm64.AppImage" \
            "$VERSION"

      - name: Upload Linux AppImages and manifests to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            artifacts/x64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-x86_64.AppImage
            artifacts/x64/latest-linux.yml
            artifacts/arm64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-arm64.AppImage
            artifacts/arm64/latest-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  combine-electron-manifests:
    needs: [create-release, build-desktop-electron-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Download per-arch latest-mac.yml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*-apple-darwin
          path: artifacts

      - name: Verify macOS arm64 manifest
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find artifacts -type f -name latest-mac.yml -print)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one arm64 latest-mac.yml file, found ${#manifests[@]}"
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi

      - name: Finalize combined latest-mac.yml
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Verify combined macOS manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/latest-mac.yml"
          test -s "$manifest"
          grep -Fq "OpenChamber-${VERSION}-mac-arm64.zip" "$manifest"

      - name: Upload combined macOS manifest to draft release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: ${{ runner.temp }}/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive combined macOS manifest for diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-update-manifest
          path: ${{ runner.temp }}/latest-mac.yml
          retention-days: 7

  mobile-release:
    needs: create-release
    uses: ./.github/workflows/mobile-release.yml
    with:
      version_name: ${{ needs.create-release.outputs.version }}
      build_number: ${{ github.run_number }}
      release_tag: v${{ needs.create-release.outputs.version }}
      upload_github_release: true
      build_android: true
      # TestFlight follows the native requirement, not the v* tag itself:
      # native-mode betas and ALL stable releases build + upload iOS (betas
      # internal-only, stable also publishes the external group); web-only
      # (mode: ota) betas skip iOS entirely — existing shells update via OTA.
      build_ios: ${{ needs.create-release.outputs.plan_mode == 'native' || !contains(needs.create-release.outputs.version, '-') }}
      publish_external_testflight: ${{ !contains(needs.create-release.outputs.version, '-') }}
      # Bake OTA channel into the native shell at mobile:sync. Prerelease tags
      # stay on beta; plain semver store builds use stable.
      ota_channel: ${{ contains(needs.create-release.outputs.version, '-') && 'beta' || 'stable' }}
    secrets: inherit

  # After a native mobile release, publish the matching web bundle as active OTA
  # and move nativeTargets. Fresh installs must never be rolled back to an older
  # activeBundle. Does not touch desktop latest feeds or /releases/latest.
  mobile-native-targets:
    name: Publish mobile nativeTargets to OTA
    needs: [create-release, mobile-release]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && needs.mobile-release.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-ota-production
      cancel-in-progress: false
    env:
      OTA_BASE_URL: https://openchamber-update.vercel.app
      MOBILE_APP_ID: com.yee94.openchamber
      MAX_BUNDLE_BYTES: 25165824
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build mobile web assets
        run: bun run --cwd packages/mobile build

      - name: Package Capgo zip
        id: zip
        shell: bash
        working-directory: packages/mobile
        env:
          CAPGO_PRIVATE_KEY_V2: ${{ secrets.CAPGO_PRIVATE_KEY_V2 }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          DIST="dist"
          ZIP_NAME="openchamber-${VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          ZIP_JSON="$(npx --yes @capgo/cli@8.45.1 bundle zip "$MOBILE_APP_ID" \
            --package-json "$PWD/package.json" \
            --path "$DIST" \
            --name "$ZIP_PATH" \
            --no-code-check \
            --json)"
          echo "$ZIP_JSON"
          if [[ ! -f "$ZIP_PATH" ]]; then
            FOUND="$(find . -maxdepth 3 -type f -name "$ZIP_NAME" -print -quit || true)"
            if [[ -z "$FOUND" ]]; then
              FOUND="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit || true)"
            fi
            if [[ -z "$FOUND" ]]; then
              echo "Capgo zip output not found"
              exit 1
            fi
            cp "$FOUND" "$ZIP_PATH"
          fi
          CHECKSUM="$(node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const j = JSON.parse(process.argv[1]);
            const fromJson = j.checksum || j.Checksum || j.hash;
            if (typeof fromJson === 'string' && fromJson.length > 0) {
              const hex = fromJson.replace(/^sha256:/i, '');
              if (/^[0-9a-f]{64}$/i.test(hex)) {
                process.stdout.write('sha256:' + hex.toLowerCase());
                process.exit(0);
              }
            }
            const digest = crypto.createHash('sha256').update(fs.readFileSync(process.argv[2])).digest('hex');
            process.stdout.write('sha256:' + digest);
          " "$ZIP_JSON" "$ZIP_PATH")"
          SESSION_KEY=""
          if [[ -n "${CAPGO_PRIVATE_KEY_V2:-}" ]]; then
            KEY_FILE="$RUNNER_TEMP/capgo_private_key_v2.pem"
            printf '%s' "$CAPGO_PRIVATE_KEY_V2" > "$KEY_FILE"
            ENC_JSON="$(npx --yes @capgo/cli@8.45.1 bundle encrypt "$ZIP_PATH" "${CHECKSUM#sha256:}" \
              --key "$KEY_FILE" \
              --json)"
            ENC_CHECKSUM="$(node -e "
              const j = JSON.parse(process.argv[1]);
              const c = j.checksum || j.Checksum;
              if (typeof c === 'string' && c.trim().length > 0) process.stdout.write(c.trim());
            " "$ENC_JSON" || true)"
            SESSION_KEY="$(node -e "
              const j = JSON.parse(process.argv[1]);
              process.stdout.write(j.ivSessionKey || j.sessionKey || j.key || '');
            " "$ENC_JSON")"
            ENC_ZIP="$(dirname "$ZIP_PATH")/$(basename "$ZIP_PATH" .zip)_encrypted.zip"
            if [[ -f "$ENC_ZIP" ]]; then
              ZIP_PATH="$ENC_ZIP"
              if [[ -z "$ENC_CHECKSUM" ]]; then
                echo "::error::Capgo CLI did not return an encrypted checksum; refusing to publish an unverifiable encrypted bundle."
                exit 1
              fi
              CHECKSUM="$ENC_CHECKSUM"
            fi
            rm -f "$KEY_FILE"
          fi
          SIZE="$(node -e "process.stdout.write(String(require('fs').statSync(process.argv[1]).size))" "$ZIP_PATH")"
          if (( SIZE > MAX_BUNDLE_BYTES )); then
            echo "::error::OTA zip is ${SIZE} bytes (> ${MAX_BUNDLE_BYTES})."
            exit 1
          fi
          SESSION_KEY_FILE="$RUNNER_TEMP/capgo_session_key.txt"
          if [[ -n "$SESSION_KEY" ]]; then
            printf '%s' "$SESSION_KEY" > "$SESSION_KEY_FILE"
          else
            : > "$SESSION_KEY_FILE"
          fi
          {
            echo "zip_path=$ZIP_PATH"
            echo "checksum=$CHECKSUM"
            echo "session_key_file=$SESSION_KEY_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare nativeTargets snapshot
        id: prepare
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          OTA_BASE_URL: ${{ env.OTA_BASE_URL }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          CHECKSUM: ${{ steps.zip.outputs.checksum }}
          SESSION_KEY_FILE: ${{ steps.zip.outputs.session_key_file }}
          # Match the channel baked into this release's shells (see mobile-release inputs).
          OTA_CHANNEL: ${{ contains(needs.create-release.outputs.version, '-') && 'beta' || 'stable' }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ota-native-targets"
          ANDROID_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          # Fixed TestFlight public link (stable external group). Advertise the
          # native iOS target only when this release actually uploaded iOS
          # (native-mode betas and stable); web-only betas keep the previous
          # advertisement instead of pointing at a build that was never shipped.
          IOS_URL="https://testflight.apple.com/join/ZCENBHtm"
          BUILD_IOS="${{ needs.create-release.outputs.plan_mode == 'native' || !contains(needs.create-release.outputs.version, '-') }}"
          PLAN_JSON="$(node scripts/mobile-release-plan.mjs --json)"
          PLAN_MODE="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).mode || '')" "$PLAN_JSON")"
          echo "mobile-release-plan mode=$PLAN_MODE"

          # Publish the same-version web bundle first so a fresh native install
          # cannot be rolled back to an older activeBundle. Raise
          # minShellReleaseVersion only when the native shell actually changed
          # (mode: native), for BOTH platforms and both channels — the in-app
          # one-tap-vs-reinstall choice is decided here by web/shell version
          # identity, independent of OTA publishing and of github.run_number.
          # Web-only releases (mode: ota) keep existing shells on apply_ota;
          # stable never raises the floor just because it shipped an installer.
          # BUILD_NUMBER remains for nativeTargets / asset naming only.
          if [[ "$PLAN_MODE" == "native" ]]; then
            export MIN_SHELL_RELEASE_VERSION="$VERSION"
          fi
          ASSEMBLE_ARGS=(
            --zip "$ZIP_PATH"
            --version "$VERSION"
            --checksum "$CHECKSUM"
            --channel "$OTA_CHANNEL"
            --out "$OUT"
          )
          if [[ -s "${SESSION_KEY_FILE:-}" ]]; then
            ASSEMBLE_ARGS+=(--session-key "$(cat "$SESSION_KEY_FILE")")
          fi
          node scripts/mobile-ota/assemble-snapshot.mjs "${ASSEMBLE_ARGS[@]}"

          OUT="$OUT" VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" IOS_URL="$IOS_URL" ANDROID_URL="$ANDROID_URL" OTA_CHANNEL="$OTA_CHANNEL" BUILD_IOS="$BUILD_IOS" PLAN_MODE="$PLAN_MODE" \
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const out = process.env.OUT;
          const version = process.env.VERSION;
          const build = Number.parseInt(process.env.BUILD_NUMBER, 10);
          const iosUrl = process.env.IOS_URL;
          const androidUrl = process.env.ANDROID_URL;
          const channel = process.env.OTA_CHANNEL;
          const buildIos = process.env.BUILD_IOS === 'true';
          const planMode = process.env.PLAN_MODE;
          const channelPath = path.join(out, 'ota', 'channels', `${channel}.json`);
          const manifest = JSON.parse(readFileSync(channelPath, 'utf8'));
          if (!manifest.activeBundle || manifest.activeBundle.releaseVersion !== version) {
            throw new Error(`Assembled activeBundle.releaseVersion must be ${version}, got ${manifest.activeBundle?.releaseVersion ?? 'none'}`);
          }
          manifest.nativeTargets = manifest.nativeTargets || {};
          if (planMode === 'ota') {
            // Do not raise the shell gate on web-only releases. Legacy
            // platforms.*.minNativeBuild may still be present for schema
            // compatibility; keep the historical android<=ios sync only.
            const iosMin = manifest.activeBundle.platforms?.ios?.minNativeBuild;
            const androidMin = manifest.activeBundle.platforms?.android?.minNativeBuild;
            if (Number.isInteger(iosMin) && Number.isInteger(androidMin) && androidMin > iosMin) {
              manifest.activeBundle.platforms.android.minNativeBuild = iosMin;
            }
          } else {
            // Version-gate floor (top-level); build number is not used for
            // in-app update decisions anymore.
            manifest.activeBundle.minShellReleaseVersion = version;
            manifest.nativeTargets.android = {
              version,
              build,
              status: 'published',
              installUrl: androidUrl,
            };
          }
          if (buildIos) {
            manifest.nativeTargets.ios = {
              version,
              build,
              status: 'published',
              installUrl: iosUrl,
            };
          }
          writeFileSync(channelPath, `${JSON.stringify(manifest, null, 2)}\n`);
          writeFileSync(path.join(out, 'ota-meta.json'), `${JSON.stringify({
            action: 'native-release-ota',
            channel,
            generation: manifest.generation,
            bundleId: manifest.activeBundle.bundleId,
            nativeTargets: manifest.nativeTargets,
          }, null, 2)}\n`);
          NODE

          echo "snapshot_dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Vercel pull + prebuilt build + overlay OTA
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_DIR: ${{ steps.prepare.outputs.snapshot_dir }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" || -z "${VERCEL_ORG_ID}" || -z "${VERCEL_PROJECT_ID}" ]]; then
            echo "Skipping OTA nativeTargets deploy; Vercel secrets are not configured."
            exit 0
          fi

          mkdir -p deploy/update-service/.vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" \
            > deploy/update-service/.vercel/project.json

          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" \
            --cwd deploy/update-service
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" \
            --cwd deploy/update-service

          STATIC_DIR="deploy/update-service/.vercel/output/static"
          if [[ ! -d "$STATIC_DIR" ]]; then
            echo "Expected prebuilt static dir missing: $STATIC_DIR"
            exit 1
          fi
          mkdir -p "$STATIC_DIR/ota"
          cp -R "$SNAPSHOT_DIR/ota/." "$STATIC_DIR/ota/"

          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --cwd deploy/update-service
          rm -rf deploy/update-service/.vercel

      - name: Verify client update detectability
        env:
          OTA_BASE_URL: ${{ env.OTA_BASE_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          PLAN_MODE: ${{ needs.create-release.outputs.plan_mode }}
          OTA_CHANNEL: ${{ contains(needs.create-release.outputs.version, '-') && 'beta' || 'stable' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Deploy is skipped when Vercel secrets are absent; nothing to verify then.
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Skipping detectability verify; Vercel secrets are not configured."
            exit 0
          fi
          node scripts/mobile-ota/verify-detectability.mjs \
            --channel "$OTA_CHANNEL" --version "$VERSION" --mode "$PLAN_MODE"

  publish-relay-docker-manual:
    name: Publish only the Relay Docker image
    if: ${{ inputs.relay_only }}
    uses: ./.github/workflows/relay-docker.yml
    with:
      version: ${{ inputs.version }}
      push: true
    secrets: inherit

  publish-relay-docker:
    name: Publish Relay image to Docker Hub
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows, publish-electron-linux, combine-electron-manifests, mobile-release]
    uses: ./.github/workflows/relay-docker.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    secrets: inherit

  publish-npm:
    name: Publish npm packages
    needs: create-release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web package
        run: bun run build:web

      - name: Publish @openchambery/web and @openchambery/relay-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is required to publish npm packages." >&2
            exit 1
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            (cd packages/web && npm publish --access public --tag beta)
            (cd packages/relay-server && npm publish --access public --tag beta)
          else
            (cd packages/web && npm publish --access public)
            (cd packages/relay-server && npm publish --access public)
          fi

  finalize-release:
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows, publish-electron-linux, combine-electron-manifests, mobile-release, publish-relay-docker, publish-npm]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (github.event_name != 'workflow_dispatch' || !inputs.dry_run) &&
        needs.create-release.result == 'success' &&
        needs.build-desktop-electron-macos.result == 'success' &&
        needs.build-desktop-electron-windows.result == 'success' &&
        needs.publish-electron-linux.result == 'success' &&
        needs.combine-electron-manifests.result == 'success' &&
        needs.mobile-release.result == 'success' &&
        needs.publish-relay-docker.result == 'success' &&
        needs.publish-npm.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_UPDATE_ROLE_ID }}
    steps:
      - name: Checkout main for update manifest publication
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main

      - name: Verify complete release asset inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          (async () => {
          const {
            REPOSITORY: repo,
            RELEASE_ID: releaseId,
            VERSION: version,
            BUILD_NUMBER: buildNumber,
            GITHUB_TOKEN: token,
          } = process.env;
          const expected = [
            `OpenChamber-${version}-mac-arm64.dmg`,
            `OpenChamber-${version}-mac-arm64.dmg.blockmap`,
            `OpenChamber-${version}-mac-arm64.zip`,
            `OpenChamber-${version}-mac-arm64.zip.blockmap`,
            'latest-mac.yml',
            `OpenChamber-${version}-win-x64.exe`,
            `OpenChamber-${version}-win-x64.exe.blockmap`,
            'latest.yml',
            `OpenChamber-${version}-linux-x86_64.AppImage`,
            'latest-linux.yml',
            `OpenChamber-${version}-linux-arm64.AppImage`,
            'latest-linux-arm64.yml',
            'app-release.aab',
            'app-release.apk',
            `OpenChamber-${version}-${buildNumber}-android.aab`,
            `OpenChamber-${version}-${buildNumber}-android.apk`,
          ];
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Failed to inspect release assets: ${response.status} ${await response.text()}`);
          const release = await response.json();
          if (release.assets.length !== expected.length) {
            throw new Error(`Expected exactly ${expected.length} release assets, found ${release.assets.length}: ${release.assets.map((asset) => asset.name).join(', ')}`);
          }
          for (const name of expected) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) {
              throw new Error(`Release asset ${name} has invalid size ${matches[0].size}`);
            }
          }
          console.log(`Verified the complete ${expected.length}-asset release inventory.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "Missing create-release release_id" >&2
            exit 1
          fi
          # softprops/action-gh-release with draft:false + tag_name can create a
          # second empty published release, then fail with tag_name already_exists
          # while leaving the asset-bearing draft unpublished. Publish the known
          # draft by id instead.
          # Keep prerelease bits off /releases/latest so desktop Vercel feeds
          # and Android "latest APK" stay on the newest stable release.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease="$([[ "${IS_PRERELEASE}" == "true" ]] && echo true || echo false)" \
            --jq '{id, tag_name, draft, prerelease, asset_count: (.assets|length)}'

      - name: Publish Vercel update manifest
        if: ${{ needs.create-release.outputs.is_prerelease != 'true' }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node deploy/update-service/scripts/write-release-manifest.mjs "$VERSION"
          if git diff --quiet -- deploy/update-service/release-manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/update-service/release-manifest.json
          git commit -m "chore: publish update manifest v${VERSION}"
          git push origin HEAD:main

      - name: Deploy update service to Vercel
        if: ${{ needs.create-release.outputs.is_prerelease != 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" || -z "${VERCEL_ORG_ID}" || -z "${VERCEL_PROJECT_ID}" ]]; then
            echo "Skipping Vercel deploy; VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not configured."
            exit 0
          fi
          # Project has no rootDirectory; deploy the update-service package directory.
          mkdir -p deploy/update-service/.vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > deploy/update-service/.vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --cwd deploy/update-service
          rm -rf deploy/update-service/.vercel

      - name: Send release to Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_ROLE_ID: ${{ env.DISCORD_UPDATE_ROLE_ID }}
        run: |
          node - <<'NODE'
          (async () => {
            const tag = `v${process.env.VERSION}`;
            const repo = process.env.REPOSITORY;
            const rawRoleId = (process.env.UPDATE_ROLE_ID || '').trim();
            const updateRoleId = /^\d+$/.test(rawRoleId) ? rawRoleId : '';

            const releaseRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });

            if (!releaseRes.ok) {
              const body = await releaseRes.text();
              throw new Error(`Failed to fetch release ${tag}: ${releaseRes.status} ${body}`);
            }

            const release = await releaseRes.json();
            const description = (release.body || `OpenChamber ${tag} released.`).slice(0, 4096);
            const mention = updateRoleId ? `<@&${updateRoleId}>` : '';

            const payload = {
              username: 'OpenChamber Releases',
              ...(mention ? { content: mention } : {}),
              ...(updateRoleId
                ? {
                    allowed_mentions: {
                      roles: [updateRoleId],
                    },
                  }
                : {}),
              embeds: [
                {
                  title: release.name || `OpenChamber ${tag}`,
                  url: release.html_url,
                  description,
                  color: 2105893,
                  footer: { text: 'OpenChamber Changelog' },
                },
              ],
            };

            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord release: ${discordRes.status} ${body}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Trigger openchamber-website site refresh (optional)
        env:
          WEBSITE_REPO: openchamber/openchamber-website
          WEBSITE_TOKEN: ${{ secrets.OPENCHAMBER_WEBSITE_REPO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "OPENCHAMBER_WEBSITE_REPO_TOKEN not set; skip site refresh dispatch."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$WEBSITE_REPO/dispatches" \
            -d @- <<JSON
          {
            "event_type": "site_refresh_requested",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "release_tag": "v$VERSION"
            }
          }
          JSON
