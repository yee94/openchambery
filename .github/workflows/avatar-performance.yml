name: Avatar Performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/ui/src/lib/assistant-avatar/**'
      - 'packages/ui/src/components/assistants/**Avatar*'
      - 'packages/ui/src/components/chat/AgentAvatar*'
      - 'packages/ui/src/lib/generatedAvatar*'
      - 'packages/ui/src/index.css'
      - 'packages/ui/src/styles/**'
      - 'packages/ui/src/mobile/MobileTabBar.tsx'
      - 'packages/ui/src/components/ui/chromeCdpHarness.ts'
      - 'packages/ui/package.json'
      - 'packages/ui/vitest*.ts'
      - 'scripts/experiments/assistant-avatar/**'
      - 'scripts/test/motion-frame-mock.ts'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/avatar-performance.yml'

permissions:
  contents: read

jobs:
  avatar-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Avatar scheduling and integration contracts
        run: bunx vitest run --project @yuriai/ui packages/ui/src/lib/assistant-avatar packages/ui/src/components/assistants/ProceduralAssistantAvatar.test.tsx packages/ui/src/components/chat/AgentAvatar.test.tsx
      - name: Isolated browser performance gate
        run: bun run test:avatar-performance
        env:
          YURI_TEST_EVIDENCE_DIR: ${{ runner.temp }}/avatar-performance
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-performance
          path: ${{ runner.temp }}/avatar-performance/avatar-performance.json
          if-no-files-found: ignore
          retention-days: 7
