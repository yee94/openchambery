name: TestFlight External Review

on:
  workflow_run:
    workflows: [Release, Mobile Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Stable marketing version already uploaded to TestFlight
        required: true
        type: string
      build_number:
        description: Existing TestFlight build number (does not upload another IPA)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-external-review
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve uploaded build
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const env = process.env;
          let version = env.INPUT_VERSION;
          let buildNumber = env.INPUT_BUILD_NUMBER;
          if (env.SOURCE_RUN_ID) {
            const pages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `repos/${env.GITHUB_REPOSITORY}/actions/runs/${env.SOURCE_RUN_ID}/artifacts?per_page=100`], { encoding: 'utf8' }));
            const artifacts = pages.flatMap(page => page.artifacts).filter(item => item.name === 'testflight-review-request');
            if (artifacts.length === 0) {
              console.log('No external review requested by this run.');
              process.exit(0);
            }
            if (artifacts.length !== 1 || artifacts[0].expired) throw new Error('Review request is ambiguous or expired.');
            execFileSync('gh', ['run', 'download', env.SOURCE_RUN_ID, '--repo', env.GITHUB_REPOSITORY, '--name', 'testflight-review-request', '--dir', env.RUNNER_TEMP]);
            const request = JSON.parse(readFileSync(`${env.RUNNER_TEMP}/testflight-review.json`, 'utf8'));
            if (request.runId !== env.SOURCE_RUN_ID || request.sha !== env.SOURCE_SHA) throw new Error('Review request does not match its source run.');
            ({ version, buildNumber } = request);
          }
          if (!/^\d+\.\d+\.\d+$/.test(version) || !/^\d+$/.test(buildNumber)) throw new Error('External review requires a stable version and numeric build number.');
          appendFileSync(env.GITHUB_OUTPUT, `requested=true\nversion=${version}\nbuild_number=${buildNumber}\n`);
          NODE

      - name: Submit existing build for external review
        if: steps.request.outputs.requested == 'true'
        env:
          YURI_RELEASE_IDENTITIES_VERIFIED: ${{ vars.YURI_RELEASE_IDENTITIES_VERIFIED }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/testflight-auth.p8
          TESTFLIGHT_BUNDLE_ID: com.yee94.yuri
          TESTFLIGHT_VERSION: ${{ steps.request.outputs.version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ steps.request.outputs.build_number }}
          TESTFLIGHT_EXTERNAL_BETA_GROUP_ID: ${{ vars.TESTFLIGHT_EXTERNAL_BETA_GROUP_ID }}
        run: |
          set -euo pipefail
          test "$YURI_RELEASE_IDENTITIES_VERIFIED" = true
          umask 077
          trap 'rm -f "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          node scripts/publish-testflight-external-build.mjs
