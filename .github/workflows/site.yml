name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'packages/docs/**', 'scripts/docs/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'packages/docs/**', 'scripts/docs/**', '.github/workflows/site.yml']
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && 'main' || github.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run docs:validate
      - run: bun run site:test
      - run: bun run site:build
      - run: bun run site:check
      - run: bun run check:legacy-brand && bun run check:repository-neutrality

  deploy:
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.SITE_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.SITE_VERCEL_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Check publishing configuration
        env:
          IDENTITIES_VERIFIED: ${{ vars.YURI_RELEASE_IDENTITIES_VERIFIED }}
        run: |
          test "$IDENTITIES_VERIFIED" = true
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$SITE_URL"
      - name: Refresh verified installer download snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
        run: node site/sync-downloads.mjs
      - name: Build website and handbook from this repository
        id: build
        working-directory: site
        run: |
          bunx vercel@65.2.0 pull --yes --environment=production
          bunx vercel@65.2.0 build --prod
          node verify.mjs
      - name: Deploy website project
        id: vercel
        working-directory: site
        run: bunx vercel@65.2.0 deploy --prebuilt --prod --yes
      - name: Deploy website mirror to EdgeOne
        id: edgeone
        if: ${{ !cancelled() && steps.build.outcome == 'success' && vars.SITE_EDGEONE_PROJECT_NAME != '' }}
        shell: bash
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.SITE_EDGEONE_PROJECT_NAME }}
        run: |
          test -n "$EDGEONE_TOKEN"
          bunx edgeone@1.6.46 makers deploy site/dist -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_TOKEN" -e production -a global --skip-ai-gateway-sync 2>&1 | sed -E 's/eo_token=[^&[:space:]]*/eo_token=REDACTED/g'
      - name: Verify live pages and versioned assets
        if: ${{ !cancelled() && steps.vercel.outcome == 'success' }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if node site/verify.mjs "$SITE_URL"; then exit 0; fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            echo "Waiting for Vercel production propagation (attempt $attempt/12)"
            sleep 10
          done
      - name: Verify EdgeOne custom domain
        if: ${{ !cancelled() && steps.edgeone.outcome == 'success' && vars.SITE_EDGEONE_URL != '' }}
        shell: bash
        env:
          EDGEONE_URL: ${{ vars.SITE_EDGEONE_URL }}
        run: |
          for attempt in {1..12}; do
            if node site/verify.mjs "$EDGEONE_URL"; then exit 0; fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            echo "Waiting for EdgeOne production propagation (attempt $attempt/12)"
            sleep 10
          done
