name: oc integration

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      !startsWith(github.event.comment.body, '/yuri-review') &&
      !contains(github.event.comment.body, ' /yuri-review') &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate bot app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.YURI_REVIEW_APP_ID }}
          private-key: ${{ secrets.YURI_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install OpenCode
        run: npm install --global @opencode/cli@2

      - name: Run opencode
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --standalone --auto --model opencode/gpt-5.2-codex --file "$GITHUB_EVENT_PATH" \
            "Handle the /oc or /opencode request in the attached GitHub event. Use gh to read the issue or pull request and relevant comments; for pull requests inspect the requested head and diff. Implement changes when requested, publishing them on a branch/PR rather than the default branch. Use gh to post your final answer to the originating issue or pull request. Include validation results and any failure. The event's comment.body is the user's request."
