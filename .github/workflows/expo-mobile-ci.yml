name: Expo Mobile CI

# Track 9 — static checks + side-by-side Android debug APK on work/expo-native.
# Does not replace Capacitor mobile-ci.yml on main.
# Does not claim iOS Simulator / device walks. iOS simulator residual: macos
# runner + CocoaPods + Track 8 native modules not wired in this workflow yet.
#
# Critical: published APK embeds Hermes JS (debuggableVariants=[]). Plain
# assembleDebug without that hangs forever on Expo splash when Metro is absent.
on:
  push:
    branches:
      - work/expo-native
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for this on-demand Expo CI run
        required: false
        type: string
      publish_prerelease:
        description: Create GitHub prerelease with APK (tag expo-v2-debug-<sha7>)
        required: false
        type: boolean
        default: true

concurrency:
  group: expo-mobile-ci-work-expo-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_expo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile_expo/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: apps/mobile_expo
    outputs:
      apk_name: ${{ steps.apk_meta.outputs.apk_name }}
      sha7: ${{ steps.apk_meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile_expo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Prebuild Android CNG
        run: npx expo prebuild --platform android --non-interactive
        env:
          CI: '1'

      - name: Verify debug identity + embedded-JS gradle
        run: |
          set -euo pipefail
          gradle_file=android/app/build.gradle
          test -f "$gradle_file"
          grep -q 'applicationIdSuffix ".debug"' "$gradle_file"
          grep -q 'OpenChamber Expo' "$gradle_file" || grep -q 'OpenChamber Expo' android/app/src/main/res/values/strings.xml
          # Active empty debuggableVariants so assembleDebug embeds Hermes.
          grep -E '^[[:space:]]*debuggableVariants[[:space:]]*=[[:space:]]*\[\]' "$gradle_file"
          echo "OK: debug side-by-side identity + debuggableVariants=[] (embed JS) present"

      - name: Assemble debug APK (embedded JS)
        working-directory: apps/mobile_expo/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK + assert embedded bundle
        id: apk_meta
        working-directory: apps/mobile_expo
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$apk"
          test -f "$apk"
          # Gate: sideloaded APK must contain JS (Hermes bytecode still named *.bundle).
          if ! unzip -l "$apk" | grep -E 'assets/index\.android\.bundle|\.hbc'; then
            echo "::error::APK missing embedded JS bundle — would hang on Expo splash without Metro"
            unzip -l "$apk" | grep -E 'assets/' || true
            exit 1
          fi
          echo "OK: embedded JS bundle present in APK"
          sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          out="openchamber-expo-debug-${sha7}.apk"
          cp "$apk" "$out"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "apk_name=$out" >> "$GITHUB_OUTPUT"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Upload Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-expo-android-debug-apk
          path: apps/mobile_expo/${{ steps.apk_meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Prerelease debug APK
    runs-on: ubuntu-latest
    needs: android-debug-apk
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease != false)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openchamber-expo-android-debug-apk
          path: dist

      - name: Create GitHub prerelease (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA7: ${{ needs.android-debug-apk.outputs.sha7 }}
          APK_NAME: ${{ needs.android-debug-apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          tag="expo-v2-debug-${SHA7}"
          apk="dist/${APK_NAME}"
          test -f "$apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading APK with --clobber"
            gh release upload "$tag" "$apk" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "OpenChamber Expo debug ${SHA7}" \
              --notes "Track 9 side-by-side **standalone** debug APK for work/expo-native @ $GITHUB_SHA. applicationId com.yee94.openchamber.debug, label OpenChamber Expo. Debug keystore. JS: **embedded Hermes** (debuggableVariants=[] / export:embed / dev=false) — **no Metro required**. Reuses Cap google-services.json. Not /releases/latest. Artifact: $APK_NAME. Prior tip APKs hung on Expo splash because assembleDebug omitted the JS bundle."
          fi
          echo "Prerelease URL: https://github.com/${{ github.repository }}/releases/tag/$tag"
