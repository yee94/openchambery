name: Expo Mobile CI

# Track 9 — static checks + side-by-side Android sideload APK on work/expo-native.
# Does not replace Capacitor mobile-ci.yml on main.
# Does not claim iOS Simulator / device walks. iOS simulator residual: macos
# runner + CocoaPods + Track 8 native modules not wired in this workflow yet.
#
# Critical: published APK is assembleRelease (debug keystore) with
# applicationIdSuffix .debug + embedded Hermes. assembleDebug keeps
# useDevSupport=true (ReactBuildConfig.DEBUG) and can still hang/delay on the
# Expo splash while probing Metro even when the JS bundle is inside the APK.
on:
  push:
    branches:
      - work/expo-native
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for this on-demand Expo CI run
        required: false
        type: string
      publish_prerelease:
        description: Create GitHub prerelease with APK (tag expo-v2-debug-<sha7>)
        required: false
        type: boolean
        default: true

concurrency:
  group: expo-mobile-ci-work-expo-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_expo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile_expo/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android-sideload-apk:
    name: Android sideload APK (release+debug id)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile_expo
    outputs:
      apk_name: ${{ steps.apk_meta.outputs.apk_name }}
      sha7: ${{ steps.apk_meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile_expo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Prebuild Android CNG
        run: npx expo prebuild --platform android --non-interactive
        env:
          CI: '1'

      - name: Verify release sideload identity + embedded-JS gradle
        run: |
          set -euo pipefail
          gradle_file=android/app/build.gradle
          test -f "$gradle_file"
          # Both debug and release get .debug suffix (release = published sideload).
          count=$(grep -c 'applicationIdSuffix ".debug"' "$gradle_file" || true)
          test "$count" -ge 2
          grep -q 'OpenChamber Expo' "$gradle_file" || grep -q 'OpenChamber Expo' android/app/src/main/res/values/strings.xml
          # Release must sign with debug keystore for sideload.
          # GNU awk has no \b; match release buildType inside buildTypes.
          awk '
            /buildTypes[[:space:]]*\{/ { in_bt=1 }
            in_bt && /release[[:space:]]*\{/ { in_rel=1 }
            in_rel { print }
            in_rel && /^[[:space:]]*\}/ { exit }
          ' "$gradle_file" | tee /tmp/release-bt.txt | grep -q 'signingConfig signingConfigs.debug'
          grep -q 'applicationIdSuffix ".debug"' /tmp/release-bt.txt
          awk '
            /buildTypes[[:space:]]*\{/ { in_bt=1 }
            in_bt && /debug[[:space:]]*\{/ { in_dbg=1 }
            in_dbg { print }
            in_dbg && /^[[:space:]]*\}/ { exit }
          ' "$gradle_file" | tee /tmp/debug-bt.txt | grep -q 'applicationIdSuffix ".debug"'
          # Active empty debuggableVariants so debug variant also embeds Hermes.
          grep -E '^[[:space:]]*debuggableVariants[[:space:]]*=[[:space:]]*\[\]' "$gradle_file"
          echo "OK: release sideload identity + debuggableVariants=[] present"

      - name: Assemble release APK (embedded JS, debug keystore, .debug id)
        working-directory: apps/mobile_expo/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK + assert embedded bundle
        id: apk_meta
        working-directory: apps/mobile_expo
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*-androidTest.apk' | head -n 1)
          test -n "$apk"
          test -f "$apk"
          # Gate: sideloaded APK must contain JS (Hermes bytecode still named *.bundle).
          if ! unzip -l "$apk" | grep -E 'assets/index\.android\.bundle|\.hbc'; then
            echo "::error::APK missing embedded JS bundle — would hang on Expo splash without Metro"
            unzip -l "$apk" | grep -E 'assets/' || true
            exit 1
          fi
          echo "OK: embedded JS bundle present in APK"
          sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          out="openchamber-expo-debug-${sha7}.apk"
          cp "$apk" "$out"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "apk_name=$out" >> "$GITHUB_OUTPUT"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Upload Android sideload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-expo-android-debug-apk
          path: apps/mobile_expo/${{ steps.apk_meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Android emulator smoke (past Expo splash)
    runs-on: ubuntu-latest
    needs: android-sideload-apk
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openchamber-expo-android-debug-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator install + launch + logcat gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/expo-android-emulator-smoke.sh

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-expo-android-emulator-logcat
          path: emulator-smoke/
          if-no-files-found: warn
          retention-days: 14

  publish-prerelease:
    name: Prerelease sideload APK
    runs-on: ubuntu-latest
    needs: [android-sideload-apk, android-emulator-smoke]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease != false)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openchamber-expo-android-debug-apk
          path: dist

      - name: Create GitHub prerelease (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA7: ${{ needs.android-sideload-apk.outputs.sha7 }}
          APK_NAME: ${{ needs.android-sideload-apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          tag="expo-v2-debug-${SHA7}"
          apk="dist/${APK_NAME}"
          test -f "$apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading APK with --clobber"
            gh release upload "$tag" "$apk" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "OpenChamber Expo debug ${SHA7}" \
              --notes "Track 9 side-by-side **standalone** APK for work/expo-native @ $GITHUB_SHA. applicationId com.yee94.openchamber.debug, label OpenChamber Expo. Built with **assembleRelease** + debug keystore (useDevSupport=false — no Metro probe). JS: embedded Hermes (export:embed). Emulator smoke (API 30) required green before publish. Reuses Cap google-services.json. Not /releases/latest. Artifact: $APK_NAME. Prior assembleDebug tip APKs (even with embedded JS) could still hang on Expo splash because BuildConfig.DEBUG kept developer support on."
          fi
          echo "Prerelease URL: https://github.com/${{ github.repository }}/releases/tag/$tag"
