name: Lynx Mobile CI

# Track Lynx — Linux checks + side-by-side Android sideload APK on work/lynx-native.
# Does not replace Capacitor mobile-ci.yml on main.
# Does not claim 真机过 / device walks.
#
# Sideload APK is assembleRelease (debug keystore) with applicationIdSuffix .debug
# + embedded main.lynx.bundle — mirrors Expo Track 9 (avoid assembleDebug Metro
# / useDevSupport hang modes).
on:
  push:
    branches:
      - work/lynx-native
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for this on-demand Lynx CI run
        required: false
        type: string
      publish_prerelease:
        description: Create GitHub prerelease with APK (tag lynx-v2-debug-<sha7>)
        required: false
        type: boolean
        default: true

concurrency:
  group: lynx-mobile-ci-work-lynx-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lynx-linux:
    name: lynx type-check + vitest + rspeedy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Type-check @openchamber/lynx
        run: bun run --cwd packages/lynx type-check

      - name: Vitest @openchamber/lynx
        run: bun run --cwd packages/lynx test

      - name: Rspeedy build (Lynx bundle)
        run: bun run --cwd packages/lynx build:rspeedy

      - name: Upload rspeedy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynx-rspeedy-bundle
          path: packages/lynx/dist/main.lynx.bundle
          if-no-files-found: error
          retention-days: 7

  android-sideload-apk:
    name: Android sideload APK (release+debug id)
    runs-on: ubuntu-latest
    needs: lynx-linux
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.apk_meta.outputs.apk_name }}
      sha7: ${{ steps.apk_meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install workspace + build Lynx bundle
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --cwd packages/lynx build:rspeedy
          test -f packages/lynx/dist/main.lynx.bundle
          mkdir -p packages/lynx/host/android/app/src/main/assets
          cp packages/lynx/dist/main.lynx.bundle \
            packages/lynx/host/android/app/src/main/assets/main.lynx.bundle
          ls -lh packages/lynx/host/android/app/src/main/assets/main.lynx.bundle

      - name: Gate — assets/main.lynx.bundle present before assemble
        run: |
          set -euo pipefail
          asset=packages/lynx/host/android/app/src/main/assets/main.lynx.bundle
          if [[ ! -s "$asset" ]]; then
            echo "::error::Missing embedded Lynx bundle at $asset"
            exit 1
          fi
          echo "OK: pre-assemble asset $(wc -c < "$asset") bytes"

      - name: Verify release sideload identity
        working-directory: packages/lynx/host/android
        run: |
          set -euo pipefail
          gradle_file=app/build.gradle
          test -f "$gradle_file"
          grep -q "applicationId 'com.yee94.openchamber.lynx'" "$gradle_file"
          count=$(grep -c "applicationIdSuffix '.debug'" "$gradle_file" || true)
          test "$count" -ge 2
          awk '
            /buildTypes[[:space:]]*\{/ { in_bt=1 }
            in_bt && /release[[:space:]]*\{/ { in_rel=1 }
            in_rel { print }
            in_rel && /^[[:space:]]*\}/ { exit }
          ' "$gradle_file" | tee /tmp/lynx-release-bt.txt | grep -q 'signingConfig signingConfigs.debug'
          grep -q "applicationIdSuffix '.debug'" /tmp/lynx-release-bt.txt
          echo "OK: release sideload identity present"

      - name: Assemble release APK (embedded Lynx bundle, debug keystore, .debug id)
        working-directory: packages/lynx/host/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g
        run: ./gradlew :app:assembleRelease --no-daemon --build-cache

      - name: Locate APK + assert applicationId + embedded bundle
        id: apk_meta
        working-directory: packages/lynx/host/android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*-androidTest.apk' | head -n 1)
          test -n "$apk"
          test -f "$apk"

          METADATA="$(find app/build/outputs -name output-metadata.json | head -n 1)"
          test -n "$METADATA"
          python3 - <<PY
          import json
          from pathlib import Path
          meta = json.loads(Path(r"""$METADATA""").read_text())
          application_id = meta.get("applicationId")
          if application_id != "com.yee94.openchamber.lynx.debug":
              raise SystemExit(f"expected com.yee94.openchamber.lynx.debug, got {application_id}")
          print(f"OK: applicationId={application_id}")
          PY

          # Gate: sideloaded APK must contain the Lynx JS bundle in assets.
          if ! unzip -l "$apk" | grep -E 'assets/main\.lynx\.bundle'; then
            echo "::error::APK missing assets/main.lynx.bundle — refuse to publish empty host"
            unzip -l "$apk" | grep -E 'assets/' || true
            exit 1
          fi
          echo "OK: embedded assets/main.lynx.bundle present in APK"

          sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          out="openchamber-lynx-debug-${sha7}.apk"
          cp "$apk" "$GITHUB_WORKSPACE/$out"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "apk_name=$out" >> "$GITHUB_OUTPUT"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          ls -lh "$GITHUB_WORKSPACE/$out"

      - name: Upload Android sideload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-lynx-android-debug-apk
          path: ${{ github.workspace }}/${{ steps.apk_meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Prerelease sideload APK
    runs-on: ubuntu-latest
    needs: [android-sideload-apk]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease != false)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openchamber-lynx-android-debug-apk
          path: dist

      - name: Create GitHub prerelease (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA7: ${{ needs.android-sideload-apk.outputs.sha7 }}
          APK_NAME: ${{ needs.android-sideload-apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          tag="lynx-v2-debug-${SHA7}"
          apk="dist/${APK_NAME}"
          test -f "$apk"
          branch_tip="${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notes="$(cat <<NOTES
          OpenChamber Lynx side-by-side **standalone** APK for \`work/lynx-native\` @ \`${branch_tip}\`.

          - **applicationId:** \`com.yee94.openchamber.lynx.debug\`
          - **label:** OpenChamber Lynx
          - **scheme:** \`openchamber-lynx://\`
          - **build:** assembleRelease + debug keystore (Expo-style; not assembleDebug)
          - **bundle:** embedded \`assets/main.lynx.bundle\` (rspeedy)
          - **CI:** ${run_url}
          - **Not** 真机过 / not /releases/latest
          - Cap/Flutter/Expo keep \`com.yee94.openchamber(.debug)\` — Lynx uses a unique id on purpose. FCM will NOT work until a matching Firebase Android app is added.

          Artifact: \`${APK_NAME}\`
          NOTES
          )"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading APK with --clobber"
            gh release upload "$tag" "$apk" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "OpenChamber Lynx debug ${SHA7}" \
              --notes "$notes"
          fi
          echo "Prerelease URL: https://github.com/${{ github.repository }}/releases/tag/$tag"
          echo "APK download: https://github.com/${{ github.repository }}/releases/download/${tag}/${APK_NAME}"
