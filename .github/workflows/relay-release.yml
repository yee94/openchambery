name: Relay Release

# Tag namespace:
#   relay/vX.Y.Z          → @openchambery/relay-server (npm latest) + Relay Docker
#   relay/vX.Y.Z-beta.N   → npm dist-tag beta + Relay Docker
# Does not create a GitHub Release or trigger desktop, mobile, TestFlight, or OTA.
# Ordinary v* tags continue to use release.yml for the full product release.
on:
  push:
    tags:
      - 'relay/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Relay package version to publish (e.g. 1.19.0 or 1.19.0-beta.38)'
        required: true
        type: string
      dry_run:
        description: 'Validate and build, but skip npm publish and Docker push'
        required: false
        default: false
        type: boolean

concurrency:
  group: relay-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Relay release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      dry_run: ${{ steps.get_version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve and validate version
        id: get_version
        env:
          DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          RELEASE_REF: ${{ github.ref }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION#v}"
          elif [[ "$RELEASE_REF" == refs/tags/relay/v* ]]; then
            version="${GITHUB_REF#refs/tags/relay/v}"
          else
            echo "Unexpected Relay release ref: $RELEASE_REF (expected refs/tags/relay/v…)" >&2
            exit 1
          fi
          if [[ -z "$version" || "$version" == *'/'* || "$version" == v* ]]; then
            echo "Invalid Relay version derived from tag/inputs: '$version'" >&2
            exit 1
          fi

          VERSION="$version" node - <<'NODE'
          const fs = require('fs');
          const expected = process.env.VERSION;
          const file = 'packages/relay-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (pkg.name !== '@openchambery/relay-server') {
            throw new Error(`Expected package name @openchambery/relay-server, got ${pkg.name}`);
          }
          if (pkg.version !== expected) {
            throw new Error(
              `Relay tag version ${expected} does not match ${file}: ${pkg.version}`
            );
          }
          NODE

          dry_run=false
          if [[ "${DISPATCH_DRY_RUN}" == "true" ]]; then
            dry_run=true
          fi
          if [[ "$dry_run" != "true" && -z "${NPM_TOKEN}" ]]; then
            echo "NPM_TOKEN is required to publish @openchambery/relay-server." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Relay package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Relay package Vitest
        run: bunx vitest run --project @openchamber/relay-server

      - name: Type-check Relay package
        run: bun run --cwd packages/relay-server type-check

      - name: Lint Relay package
        run: bun run --cwd packages/relay-server lint

      - name: Node smoke test
        run: bun run --cwd packages/relay-server test:node

      - name: Verify npm pack contract
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/relay-server && npm pack --dry-run --json --ignore-scripts) > "$RUNNER_TEMP/relay-pack.json"
          node - <<'NODE'
          const fs = require('fs');
          const packPath = `${process.env.RUNNER_TEMP}/relay-pack.json`;
          const data = JSON.parse(fs.readFileSync(packPath, 'utf8'));
          const pack = Array.isArray(data) ? data[0] : data;
          const files = new Set((pack.files || []).map((file) => file.path));
          const required = [
            'bin/openchamber-relay.js',
            'bin/openchamber-push-relay.js',
            'bin/cli-entry.js',
            'src/index.js',
            'src/push/index.js',
            'src/push/server.js',
            'src/push/cli.js',
            'package.json',
            'README.md',
            'DOCUMENTATION.md',
          ];
          const missing = required.filter((file) => !files.has(file));
          if (missing.length > 0) {
            throw new Error(`npm pack is missing required files:\n${missing.join('\n')}`);
          }
          NODE

  publish-npm:
    name: Publish @openchambery/relay-server
    needs: [validate, test]
    if: ${{ needs.validate.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @openchambery/relay-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is required to publish npm packages." >&2
            exit 1
          fi
          actual="$(node -p "require('./packages/relay-server/package.json').version")"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "Refusing to publish: packages/relay-server/package.json is $actual, expected $VERSION" >&2
            exit 1
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            (cd packages/relay-server && npm publish --access public --tag beta)
          else
            (cd packages/relay-server && npm publish --access public)
          fi

  publish-docker:
    name: Publish Relay Docker image
    needs: [validate, test]
    uses: ./.github/workflows/relay-docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: ${{ needs.validate.outputs.dry_run != 'true' }}
      require_root_version_match: false
    secrets: inherit

  release-gate:
    name: Require npm and Docker success
    needs: [validate, test, publish-npm, publish-docker]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Relay release gate
        env:
          VALIDATE: ${{ needs.validate.result }}
          TEST: ${{ needs.test.result }}
          NPM: ${{ needs.publish-npm.result }}
          DOCKER: ${{ needs.publish-docker.result }}
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if [[ "$VALIDATE" != "success" ]]; then
            echo "Relay version validation failed ($VALIDATE)." >&2
            failed=1
          fi
          if [[ "$TEST" != "success" ]]; then
            echo "Relay package tests failed ($TEST)." >&2
            failed=1
          fi
          if [[ "$TEST" == "success" && "$DOCKER" != "success" ]]; then
            echo "Relay Docker publish failed ($DOCKER)." >&2
            failed=1
          fi
          if [[ "$TEST" == "success" && "$DRY_RUN" == "true" ]]; then
            if [[ "$NPM" != "skipped" && "$NPM" != "success" ]]; then
              echo "Unexpected npm job result during dry run ($NPM)." >&2
              failed=1
            fi
          elif [[ "$TEST" == "success" && "$NPM" != "success" ]]; then
            echo "Relay npm publish failed ($NPM)." >&2
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Relay dry run passed for ${{ needs.validate.outputs.version }}."
          else
            echo "Relay release passed for ${{ needs.validate.outputs.version }}."
          fi
