name: Relay Docker

on:
  workflow_call:
    inputs:
      version:
        description: 'Image version tag; must match the Relay package version'
        required: true
        type: string
      push:
        description: 'Push the built image to Docker Hub'
        required: false
        default: true
        type: boolean
      require_root_version_match:
        description: 'Require the repository root package.json version to match the image version. Defaults to true to preserve the existing dual-manifest check. Set false for relay/v* releases that version the Relay package independently.'
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        description: 'Docker Hub personal access token with Read and Write permissions'
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag; must match the Relay package version'
        required: true
        type: string
      push:
        description: 'Push the built image to Docker Hub'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  RELAY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/openchamber-relay

jobs:
  validate:
    name: Validate Relay image inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release and Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SHOULD_PUSH: ${{ inputs.push }}
          REQUIRE_ROOT_VERSION_MATCH: ${{ inputs.require_root_version_match }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "Missing repository variable DOCKERHUB_USERNAME." >&2
            exit 1
          fi
          if [[ "$SHOULD_PUSH" == "true" && -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Missing repository secret DOCKERHUB_TOKEN." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const expected = process.env.VERSION;
          const requireRoot = process.env.REQUIRE_ROOT_VERSION_MATCH !== 'false';
          const manifests = ['packages/relay-server/package.json'];
          if (requireRoot) {
            manifests.unshift('package.json');
          }
          const mismatches = manifests.flatMap((file) => {
            const actual = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            return actual === expected ? [] : [`${file}: ${actual}`];
          });
          if (mismatches.length > 0) {
            throw new Error(`Relay image version ${expected} does not match:\n${mismatches.join('\n')}`);
          }
          NODE

  build:
    name: Build Relay (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image labels
        id: relay_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.RELAY_IMAGE }}
          labels: |
            org.opencontainers.image.title=OpenChamber Relay Server
            org.opencontainers.image.description=Self-hosted private relay server for OpenChamber
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build platform image (no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.relay
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.relay_meta.outputs.labels }}
          push: false
          cache-from: type=gha,scope=openchamber-relay-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=openchamber-relay-${{ matrix.platform_pair }}

      - name: Build and push by digest
        id: build
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.relay
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.relay_meta.outputs.labels }}
          outputs: type=image,name=${{ env.RELAY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=openchamber-relay-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=openchamber-relay-${{ matrix.platform_pair }}

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "Build step did not produce an image digest." >&2
            exit 1
          fi
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-digest-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch Relay manifest
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: relay-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Full Hub login (no repository-scoped credentials). imagetools create must
      # pull untagged digests and push the multi-arch manifest list; scoped
      # @push-only auth returns 401 on the pull leg.
      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: relay_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.RELAY_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        env:
          RELAY_IMAGE: ${{ env.RELAY_IMAGE }}
          VERSION: ${{ inputs.version }}
          DOCKER_METADATA_TAGS: ${{ steps.relay_meta.outputs.tags }}
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          if [[ ${#digests[@]} -eq 0 ]]; then
            echo "No platform digests were uploaded." >&2
            exit 1
          fi
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(-t "$tag")
          done <<< "$DOCKER_METADATA_TAGS"
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "No image tags were prepared for the multi-arch manifest." >&2
            exit 1
          fi
          refs=()
          for digest_file in "${digests[@]}"; do
            # Artifact upload can include nested paths; only the basename is the digest hash.
            digest_hash="$(basename "$digest_file")"
            refs+=("${RELAY_IMAGE}@sha256:${digest_hash}")
          done
          echo "Creating multi-arch manifest from: ${refs[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${RELAY_IMAGE}:${VERSION}"
