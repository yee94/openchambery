name: Docs Source

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "scripts/docs/**"
      - "package.json"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag to upload docs source archive"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.archive.outputs.archive_name }}
    steps:
      - name: Require verified Yuri publishing identities
        shell: bash
        env:
          YURI_RELEASE_IDENTITIES_VERIFIED: ${{ vars.YURI_RELEASE_IDENTITIES_VERIFIED }}
        run: |
          if [ "$YURI_RELEASE_IDENTITIES_VERIFIED" != "true" ]; then
            echo "Release blocked: complete docs/RELEASING.md ownership checks first." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Validate docs source
        run: bun run docs:validate

      - name: Build docs source archive
        id: archive
        run: |
          mkdir -p artifacts
          ARCHIVE_NAME="yuri-docs-source-${GITHUB_SHA::8}.tar.gz"
          tar -czf "artifacts/${ARCHIVE_NAME}" -C packages/docs .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-source
          path: artifacts/${{ steps.archive.outputs.archive_name }}
          retention-days: 14

      - name: Upload archive to release tag
        if: ${{ github.event_name == 'release' || github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
          files: artifacts/${{ steps.archive.outputs.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
